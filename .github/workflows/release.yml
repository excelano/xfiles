name: release

# The release is created with a person's token, which fires `release:
# published`, so this starts itself and goreleaser attaches its archives,
# packages and checksums to the release that is already there. A release
# created with a workflow's GITHUB_TOKEN fires nothing, and is dispatched by
# hand instead.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist."
        required: true

# goreleaser needs to write to the GitHub release (upload assets), so the
# job needs `contents: write` on the auto-provided GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser uses git history to build the changelog, so we need
          # full clone history rather than the default shallow one.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Every architecture above is built on one amd64 runner, so nothing arm64
  # has run at this point — the packages are cross-compiled and shipped
  # unexecuted. This installs them on arm64 hardware and runs what they
  # installed, before anybody reaches them through apt.
  smoke:
    needs: goreleaser
    uses: excelano/.github/.github/workflows/deb-smoke.yml@main
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
